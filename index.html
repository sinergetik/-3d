<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор ручки шпателя 2D/3D с посадочными местами</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 380px; background: #1e1e1e; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; border-right: 1px solid #333; }
        h2 { font-size: 1.1rem; margin-top: 0; color: #4CAF50; }
        h3 { font-size: 0.9rem; margin: 10px 0 5px 0; color: #ff9800; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; color: #bbb; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .tabs { display: flex; gap: 5px; margin-bottom: 5px; }
        .tab-btn { flex: 1; background: #2c2c2c; border: 1px solid #444; color: #aaa; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        button.action-btn { background: #4CAF50; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        button.action-btn:hover { background: #45a049; }
        #viewer { flex-grow: 1; position: relative; background: #181818; }
        #canvas-3d, #canvas-2d { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #canvas-2d { display: none; background: #141414; }
        .info { font-size: 0.75rem; color: #888; border-top: 1px solid #333; padding-top: 8px; margin-top: 5px; }
    </style>
    <!-- Подключаем Three.js, OrbitControls, STLExporter и библиотеку ThreeCSG для реального вычитания отверстий -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <!-- Подключаем надежный порт ThreeCSG для булевых операций в Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three-csg-ts@3.1.16/lib/three-csg.js"></script>
</head>
<body>

    <div id="sidebar">
        <h2>Эргономичная рукоять шпателя</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchView('3d')">3D Вид</button>
            <button class="tab-btn tab-2d" onclick="switchView('2d')">2D Чертёж</button>
        </div>

        <h3>Форма и хват</h3>
        <div class="control-group">
            <label><span>Длина рукояти:</span> <span id="val-length">110</span> мм</label>
            <input type="range" id="length" min="90" max="140" value="110">
        </div>

        <div class="control-group">
            <label><span>Толщина рукояти:</span> <span id="val-thickness">22</span> мм</label>
            <input type="range" id="thickness" min="16" max="30" value="22">
        </div>

        <div class="control-group">
            <label><span>Глубина выемки (подпальцевая):</span> <span id="val-groove">6</span> мм</label>
            <input type="range" id="groove" min="0" max="12" value="6">
        </div>

        <h3>Базовые узлы (посадочные места)</h3>
        <div class="control-group">
            <label><span>Диаметр латунных шайб:</span> <span id="val-brass-d">25.2</span> мм</label>
            <input type="range" id="brass_d" min="24" max="27" step="0.1" value="25.2">
        </div>

        <div class="control-group">
            <label><span>Глубина гнезда (на сторону):</span> <span id="val-brass-h">2.1</span> мм</label>
            <input type="range" id="brass_h" min="1.0" max="4.0" step="0.1" value="2.1">
        </div>

        <div class="control-group">
            <label><span>Отверстие под болт:</span> <span id="val-bolt-d">4.9</span> мм</label>
            <input type="range" id="bolt_d" min="4.5" max="6.0" step="0.1" value="4.9">
        </div>

        <div class="control-group">
            <label><span>Диаметр стального колеса:</span> <span id="val-wheel-d">75</span> мм</label>
            <input type="range" id="wheel_d" min="60" max="90" value="75">
        </div>

        <button class="action-btn" id="export-btn">Скачать STL для печати</button>

        <div class="info">
            • Посадка под латунь: с вырезами под шайбы с двух сторон<br>
            • Отверстие под болт: сквозное сквозь всю рукоять<br>
            • Модель обновляется в реальном времени с учетом CSG
        </div>
    </div>

    <div id="viewer">
        <div id="canvas-3d"></div>
        <canvas id="canvas-2d"></canvas>
    </div>

    <script>
        let scene, camera, renderer, controls, handleMesh, wheelMesh, brassLeftMesh, brassRightMesh;
        let currentMode = '3d';
        
        const params = {
            length: 110,
            thickness: 22,
            groove: 6,
            brass_d: 25.2,
            brass_h: 2.1,
            bolt_d: 4.9,
            wheel_d: 75
        };

        function init3D() {
            const container = document.getElementById('canvas-3d');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x181818);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, -120, 120);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(50, -100, 100);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x222222);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            updateModels();
            animate();
        }

        function createHandleShape() {
            const shape = new THREE.Shape();
            const l = params.length;
            const t = params.thickness;
            const g = params.groove;

            shape.moveTo(0, 0);
            shape.lineTo(l * 0.3, t * 0.5);
            shape.lineTo(l * 0.7, t * 0.45);
            shape.quadraticCurveTo(l, t * 0.2, l, 0);
            shape.quadraticCurveTo(l, -t * 0.2, l * 0.7, -t * 0.45);
            shape.lineTo(l * 0.4, -t * 0.5 + g);
            shape.lineTo(l * 0.2, -t * 0.5);
            shape.lineTo(0, -t * 0.3);
            shape.closePath();

            return shape;
        }

        function updateModels() {
            if (handleMesh) scene.remove(handleMesh);
            if (wheelMesh) scene.remove(wheelMesh);
            if (brassLeftMesh) scene.remove(brassLeftMesh);
            if (brassRightMesh) scene.remove(brassRightMesh);

            const totalThickness = params.thickness;

            // 1. Создаем базовую геометрию рукояти через Extrude
            const extrudeSettings = {
                steps: 1,
                depth: totalThickness,
                bevelEnabled: true,
                bevelThickness: 1.5,
                bevelSize: 1.5,
                bevelSegments: 3
            };

            const shape = createHandleShape();
            const baseGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            baseGeo.center();

            // Создаем CSG объект из базовой рукояти
            let handleCSG = CSG.fromGeometry(baseGeo);

            // 2. Создаем вырез для сквозного отверстия под болт
            const boltRadius = params.bolt_d / 2;
            const boltGeo = new THREE.CylinderGeometry(boltRadius, boltRadius, totalThickness + 10, 32);
            boltGeo.rotateX(Math.PI / 2);
            // Смещаем цилиндр отверстия к центру узла крепления (-20 по X)
            boltGeo.translate(-20, 0, 0);
            const boltCSG = CSG.fromGeometry(boltGeo);
            handleCSG = handleCSG.subtract(boltCSG);

            // 3. Создаем вырезы под левую и правую латунные шайбы
            const brassRadius = params.brass_d / 2;
            const brassDepth = params.brass_h;

            // Левое посадочное гнездо
            const brassLeftGeo = new THREE.CylinderGeometry(brassRadius, brassRadius, brassDepth, 32);
            brassLeftGeo.rotateX(Math.PI / 2);
            // Позиционируем на левой боковине рукояти
            const leftOffsetZ = -totalThickness / 2 - brassDepth / 2 + 0.5; 
            brassLeftGeo.translate(-20, 0, leftOffsetZ);
            const brassLeftCSG = CSG.fromGeometry(brassLeftGeo);
            handleCSG = handleCSG.subtract(brassLeftCSG);

            // Правое посадочное гнездо
            const brassRightGeo = new THREE.CylinderGeometry(brassRadius, brassRadius, brassDepth, 32);
            brassRightGeo.rotateX(Math.PI / 2);
            const rightOffsetZ = totalThickness / 2 + brassDepth / 2 - 0.5;
            brassRightGeo.translate(-20, 0, rightOffsetZ);
            const brassRightCSG = CSG.fromGeometry(brassRightGeo);
            handleCSG = handleCSG.subtract(brassRightCSG);

            // Превращаем CSG обратно в Three.js геометрию
            const finalGeometry = CSG.toGeometry(handleCSG);
            finalGeometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({ 
                color: 0x2196F3, 
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            
            handleMesh = new THREE.Mesh(finalGeometry, material);
            scene.add(handleMesh);

            // 4. Отрендерим справочные элементы (стальное колесо и латунные шайбы в гнездах)
            const wheelRadius = params.wheel_d / 2;
            const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, 0.5, 32);
            wheelGeo.rotateX(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
            wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
            wheelMesh.position.set(-20, 0, 0);
            scene.add(wheelMesh);

            // Визуализация вставленных шайб (для наглядности)
            const brassMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.3 });
            
            const realBrassGeo = new THREE.CylinderGeometry(brassRadius, brassRadius, brassDepth, 32);
            realBrassGeo.rotateX(Math.PI / 2);

            brassLeftMesh = new THREE.Mesh(realBrassGeo, brassMat);
            brassLeftMesh.position.set(-20, 0, -totalThickness/2 - brassDepth/2);
            scene.add(brassLeftMesh);

            brassRightMesh = new THREE.Mesh(realBrassGeo, brassMat);
            brassRightMesh.position.set(-20, 0, totalThickness/2 + brassDepth/2);
            scene.add(brassRightMesh);

            if (currentMode === '2d') draw2D();
        }

        function switchView(mode) {
            currentMode = mode;
            const btn3d = document.querySelector('.tab-btn:not(.tab-2d)');
            const btn2d = document.querySelector('.tab-2d');
            const c3d = document.getElementById('canvas-3d');
            const c2d = document.getElementById('canvas-2d');

            if (mode === '3d') {
                btn3d.classList.add('active');
                btn2d.classList.remove('active');
                c3d.style.display = 'block';
                c2d.style.display = 'none';
            } else {
                btn2d.classList.add('active');
                btn3d.classList.remove('active');
                c3d.style.display = 'none';
                c2d.style.display = 'block';
                draw2D();
            }
        }

        function draw2D() {
            const canvas = document.getElementById('canvas-2d');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.translate(canvas.width / 2 - 20, canvas.height / 2 + 30);
            const scale = 2.5;
            ctx.scale(scale, scale);

            // Сетка чертежа
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for(let i = -100; i <= 100; i += 20) {
                ctx.beginPath(); ctx.moveTo(i, -100); ctx.lineTo(i, 100); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-100, i); ctx.lineTo(100, i); ctx.stroke();
            }

            // Колесо
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-20, 0, params.wheel_d / 2, 0, Math.PI * 2);
            ctx.stroke();

            // Латунная шайба посадка
            ctx.strokeStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(-20, 0, params.brass_d / 2, 0, Math.PI * 2);
            ctx.stroke();

            // Отверстие под болт
            ctx.strokeStyle = '#ff5252';
            ctx.beginPath();
            ctx.arc(-20, 0, params.bolt_d / 2, 0, Math.PI * 2);
            ctx.stroke();

            // Контур рукояти
            ctx.strokeStyle = '#2196F3';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const l = params.length;
            const t = params.thickness;
            const g = params.groove;
            
            ctx.moveTo(0, 0);
            ctx.lineTo(l * 0.3, t * 0.5);
            ctx.lineTo(l * 0.7, t * 0.45);
            ctx.quadraticCurveTo(l, t * 0.2, l, 0);
            ctx.quadraticCurveTo(l, -t * 0.2, l * 0.7, -t * 0.45);
            ctx.lineTo(l * 0.4, -t * 0.5 + g);
            ctx.lineTo(l * 0.2, -t * 0.5);
            ctx.lineTo(0, -t * 0.3);
            ctx.closePath();
            ctx.stroke();

            // Текст и размеры
            ctx.fillStyle = '#aaa';
            ctx.font = '10px sans-serif';
            ctx.fillText(`Длина: ${l} мм`, 10, 50);
            ctx.fillText(`Колесо: Ø${params.wheel_d} мм`, -50, -45);
            ctx.fillText(`Посадка под латунь: Ø${params.brass_d} мм (глубина ${params.brass_h} мм)`, -70, -30);

            ctx.restore();
        }

        function setupEvents() {
            const inputs = ['length', 'thickness', 'groove', 'brass_d', 'brass_h', 'bolt_d', 'wheel_d'];
            inputs.forEach(id => {
                const input = document.getElementById(id);
                input.addEventListener('input', (e) => {
                    params[id] = parseFloat(e.target.value);
                    document.getElementById(`val-${id}`).innerText = params[id];
                    updateModels();
                });
            });

            document.getElementById('export-btn').addEventListener('click', () => {
                const exporter = new THREE.STLExporter();
                const result = exporter.parse(handleMesh, { binary: true });
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'spatula_handle_with_pockets.stl';
                link.click();
            });

            window.addEventListener('resize', () => {
                const container = document.getElementById('viewer');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
                if (currentMode === '2d') draw2D();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init3D();
        setupEvents();
    </script>
</body>
</html>
